<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GroupTask — Floorplan</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #161b27; --surface2: #1e2535; --border: #2a3347;
    --text: #e2e8f0; --muted: #64748b; --accent: #6366f1;
    --green: #22c55e; --blue: #3b82f6; --purple: #a855f7;
    --orange: #f97316; --red: #ef4444; --teal: #14b8a6; --yellow: #eab308;
    --pink: #ec4899;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  /* TOP BAR */
  #topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
  #topbar h1 { font-size: 14px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; white-space: nowrap; }
  #topbar h1 span { color: var(--accent); }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .search-box { padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 12px; outline: none; width: 160px; }
  .search-box:focus { border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--muted); white-space: nowrap; }

  /* MAIN */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* CANVAS */
  #canvas-wrap { flex: 1; overflow: hidden; position: relative; cursor: grab; }
  #canvas-wrap.panning { cursor: grabbing; }
  svg#map { width: 100%; height: 100%; display: block; }

  /* NODE STYLES */
  .node { cursor: pointer; }
  .node rect { rx: 10; stroke-width: 1.5; transition: filter 0.15s; }
  .node:hover rect { filter: brightness(1.25); }
  .node.selected rect { stroke-width: 2.5; filter: brightness(1.3); }
  .node-title { font-size: 11.5px; font-weight: 600; fill: #fff; pointer-events: none; }
  .node-sub { font-size: 9.5px; fill: rgba(255,255,255,0.6); pointer-events: none; }
  .node-badge { font-size: 9px; fill: rgba(255,255,255,0.5); pointer-events: none; }

  /* EDGES */
  .edge { fill: none; stroke-width: 1.5; opacity: 0.35; pointer-events: none; transition: opacity 0.2s; }
  .edge.highlight { opacity: 1; stroke-width: 2.5; }
  .edge-label { font-size: 9px; fill: var(--muted); pointer-events: none; }

  /* DETAIL PANEL */
  #detail { width: 290px; background: var(--surface); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0; transition: transform 0.2s; }
  #detail.hidden { transform: translateX(100%); width: 0; padding: 0; border: none; }
  #detail h2 { font-size: 14px; font-weight: 700; }
  #detail .type-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 12px; margin-bottom: 4px; }
  #detail .desc { font-size: 12px; color: var(--muted); line-height: 1.5; }
  #detail .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 4px; }
  #detail .fn-list { display: flex; flex-direction: column; gap: 3px; }
  #detail .fn-item { font-size: 11px; font-family: 'Consolas', monospace; color: var(--text); background: var(--surface2); padding: 3px 7px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #detail .link-list { display: flex; flex-direction: column; gap: 3px; }
  #detail .link-item { font-size: 11px; color: var(--accent); cursor: pointer; display: flex; align-items: center; gap: 4px; }
  #detail .link-item:hover { text-decoration: underline; }
  #detail .close-btn { align-self: flex-end; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 3px 10px; font-size: 11px; cursor: pointer; }
  #detail .close-btn:hover { color: var(--text); }

  /* ZOOM */
  #zoom-controls { position: absolute; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 4px; }
  .zoom-btn { width: 32px; height: 32px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .zoom-btn:hover { background: var(--surface2); }

  /* MINIMAP */
  #minimap { position: absolute; bottom: 16px; left: 16px; width: 130px; height: 85px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #minimap svg { width: 100%; height: 100%; }

  scrollbar-width: thin;
</style>
</head>
<body>

<div id="topbar">
  <h1>🗺️ <span>GroupTask</span> Architecture Floorplan</h1>
  <input class="search-box" id="search" placeholder="Search modules…" autocomplete="off">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#6366f1"></div>Entry / Router</div>
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Screen</div>
    <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Service</div>
    <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div>Core Engine</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Config / Firebase</div>
    <div class="legend-item"><div class="legend-dot" style="background:#14b8a6"></div>Utility</div>
    <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div>Task UI</div>
  </div>
  <span class="hint">Scroll to zoom · Drag to pan · Click to inspect</span>
</div>

<div id="main">
  <div id="canvas-wrap">
    <svg id="map">

        <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="rgba(100,116,139,0.6)"/>
        </marker>
        <marker id="arr-hi" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
        </marker>
      </defs>
      <g id="viewport">
        <g id="edges-layer"></g>
        <g id="nodes-layer"></g>
      </g>
    </svg>
    <div id="zoom-controls">
      <button class="zoom-btn" id="zoom-in" title="Zoom In">+</button>
      <button class="zoom-btn" id="zoom-out" title="Zoom Out">−</button>
      <button class="zoom-btn" id="zoom-fit" title="Fit Screen" style="font-size:13px">⊙</button>
    </div>
    <div id="minimap"><svg id="mm-svg"></svg></div>
  </div>
  <div id="detail" class="hidden">
    <button class="close-btn" id="close-detail">✕ Close</button>
    <div id="detail-content"></div>
  </div>
</div>

// ─── RENDER ──────────────────────────────────────────────────────────────────
const svgNS = 'http://www.w3.org/2000/svg';
const W = 145, H = 62;
let transform = { x: 0, y: 0, scale: 1 };
let selectedId = null;

const vp = document.getElementById('viewport');
const edgesLayer = document.getElementById('edges-layer');
const nodesLayer = document.getElementById('nodes-layer');

function cx(n) { return n.x + W/2; }
function cy(n) { return n.y + H/2; }

const nodeMap = {};
NODES.forEach(n => nodeMap[n.id] = n);

const edgeEls = {};
EDGES.forEach(([from, to, label]) => {
  const a = nodeMap[from], b = nodeMap[to];
  if (!a || !b) return;
  const g = document.createElementNS(svgNS, 'g');
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('class','edge');
  path.setAttribute('stroke', a.color || '#64748b');
  path.setAttribute('marker-end','url(#arr)');
  const dx = cx(b)-cx(a), dy = cy(b)-cy(a);
  const mx = cx(a)+dx*0.5, my = cy(a)+dy*0.5 - Math.abs(dx)*0.15;
  path.setAttribute('d', `M${cx(a)},${cy(a)} Q${mx},${my} ${cx(b)},${cy(b)}`);
  g.appendChild(path);
  edgesLayer.appendChild(g);
  const key = from+'→'+to;
  edgeEls[key] = { el: path, from, to };
});

const nodeEls = {};
NODES.forEach(n => {
  const g = document.createElementNS(svgNS, 'g');
  g.setAttribute('class','node');
  g.setAttribute('transform', `translate(${n.x},${n.y})`);
  g.setAttribute('data-id', n.id);

  const rect = document.createElementNS(svgNS, 'rect');
  rect.setAttribute('width', W); rect.setAttribute('height', H);
  rect.setAttribute('rx', 10);
  rect.setAttribute('fill', n.color + '22');
  rect.setAttribute('stroke', n.color);
  g.appendChild(rect);

  const strip = document.createElementNS(svgNS, 'rect');
  strip.setAttribute('width', 4); strip.setAttribute('height', H);
  strip.setAttribute('rx', 10); strip.setAttribute('fill', n.color);
  g.appendChild(strip);

  const title = document.createElementNS(svgNS, 'text');
  title.setAttribute('class','node-title');
  title.setAttribute('x', 14); title.setAttribute('y', 22);
  title.textContent = n.label;
  g.appendChild(title);

  const sub = document.createElementNS(svgNS, 'text');
  sub.setAttribute('class','node-sub');
  sub.setAttribute('x', 14); sub.setAttribute('y', 38);
  sub.textContent = n.sub;
  g.appendChild(sub);

  const fnCount = (n.fns||[]).length;
  if (fnCount) {
    const badge = document.createElementNS(svgNS, 'text');
    badge.setAttribute('class','node-badge');
    badge.setAttribute('x', W-8); badge.setAttribute('y', H-8);
    badge.setAttribute('text-anchor','end');
    badge.textContent = fnCount + ' fn' + (fnCount>1?'s':'');
    g.appendChild(badge);
  }

  g.addEventListener('click', () => selectNode(n.id));
  nodesLayer.appendChild(g);
  nodeEls[n.id] = { g, rect };
});

function applyTransform() {
  vp.setAttribute('transform', `translate(${transform.x},${transform.y}) scale(${transform.scale})`);
  updateMinimap();
}

function fitView() {
  const xs = NODES.map(n=>n.x), ys = NODES.map(n=>n.y);
  const minX=Math.min(...xs)-20, minY=Math.min(...ys)-20;
  const maxX=Math.max(...xs)+W+20, maxY=Math.max(...ys)+H+20;
  const svgEl = document.getElementById('map');
  const vw = svgEl.clientWidth || window.innerWidth - 300, vh = svgEl.clientHeight || window.innerHeight - 50;
  const scaleX = vw/(maxX-minX), scaleY = vh/(maxY-minY);
  transform.scale = Math.min(scaleX, scaleY, 1)*0.92;
  transform.x = (vw - (maxX-minX)*transform.scale)/2 - minX*transform.scale;
  transform.y = (vh - (maxY-minY)*transform.scale)/2 - minY*transform.scale;
  applyTransform();
}

setTimeout(fitView, 60);

let dragging=false, startX, startY, startTX, startTY;
const wrap = document.getElementById('canvas-wrap');
wrap.addEventListener('mousedown', e=>{
  if(e.target.closest('.node')) return;
  dragging=true; startX=e.clientX; startY=e.clientY;
  startTX=transform.x; startTY=transform.y;
  wrap.classList.add('panning');
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  transform.x = startTX + (e.clientX-startX);
  transform.y = startTY + (e.clientY-startY);
  applyTransform();
});
window.addEventListener('mouseup', ()=>{ dragging=false; wrap.classList.remove('panning'); });

wrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = e.deltaY<0?1.1:0.91;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  transform.x = mx - (mx-transform.x)*factor;
  transform.y = my - (my-transform.y)*factor;
  transform.scale *= factor;
  transform.scale = Math.max(0.15, Math.min(transform.scale, 4));
  applyTransform();
}, {passive:false});

document.getElementById('zoom-in').onclick = ()=>{ transform.scale=Math.min(transform.scale*1.25,4); applyTransform(); };
document.getElementById('zoom-out').onclick = ()=>{ transform.scale=Math.max(transform.scale*0.8,0.15); applyTransform(); };
document.getElementById('zoom-fit').onclick = fitView;

function selectNode(id) {
  if(selectedId && nodeEls[selectedId]) nodeEls[selectedId].g.classList.remove('selected');
  Object.values(edgeEls).forEach(e=>{ e.el.classList.remove('highlight'); e.el.setAttribute('marker-end','url(#arr)'); });

  if(selectedId === id) { selectedId=null; showDetail(null); return; }
  selectedId = id;
  nodeEls[id].g.classList.add('selected');

  Object.values(edgeEls).forEach(e=>{
    if(e.from===id || e.to===id) {
      e.el.classList.add('highlight');
      e.el.setAttribute('stroke', nodeMap[id].color);
      e.el.setAttribute('marker-end','url(#arr-hi)');
    }
  });
  showDetail(nodeMap[id]);
}

const detail = document.getElementById('detail');
const detailContent = document.getElementById('detail-content');
document.getElementById('close-detail').onclick = ()=>{ selectNode(selectedId); };

function showDetail(node) {
  if(!node) { detail.classList.add('hidden'); return; }
  detail.classList.remove('hidden');

  const outEdges = EDGES.filter(e=>e[0]===node.id).map(e=>nodeMap[e[1]]).filter(Boolean);
  const inEdges = EDGES.filter(e=>e[1]===node.id).map(e=>nodeMap[e[0]]).filter(Boolean);

  detailContent.innerHTML = `
    <span class="type-badge" style="background:${node.color}33;color:${node.color}">${node.type.toUpperCase()}</span>
    <h2>${node.label}</h2>
    <p class="desc">${node.desc||''}</p>
    ${node.fns&&node.fns.length?`
    <div class="section-label">Exports</div>
    <div class="fn-list">${node.fns.map(f=>`<div class="fn-item">${f}</div>`).join('')}</div>`:''}
    ${outEdges.length?`
    <div class="section-label">Imports from</div>
    <div class="link-list">${outEdges.map(n=>`<div class="link-item" onclick="selectNode('${n.id}')">→ ${n.label}</div>`).join('')}</div>`:''}
    ${inEdges.length?`
    <div class="section-label">Used by</div>
    <div class="link-list">${inEdges.map(n=>`<div class="link-item" onclick="selectNode('${n.id}')">← ${n.label}</div>`).join('')}</div>`:''}
  `;
}
window.selectNode = selectNode;

document.getElementById('search').addEventListener('input', e=>{
  const q = e.target.value.toLowerCase();
  NODES.forEach(n=>{
    const el = nodeEls[n.id];
    if(!el) return;
    const match = !q || n.label.toLowerCase().includes(q) || (n.sub||'').toLowerCase().includes(q) || (n.desc||'').toLowerCase().includes(q);
    el.g.style.opacity = match ? '1' : '0.15';
  });
  Object.values(edgeEls).forEach(e=>{
    if(!q) { e.el.style.opacity=''; return; }
    const match = (nodeMap[e.from]?.label.toLowerCase().includes(q)) || (nodeMap[e.to]?.label.toLowerCase().includes(q));
    e.el.style.opacity = match?'0.6':'0.05';
  });
});

function updateMinimap() {
  const mm = document.getElementById('mm-svg');
  const xs=NODES.map(n=>n.x), ys=NODES.map(n=>n.y);
  const minX=Math.min(...xs)-20, minY=Math.min(...ys)-20;
  const maxX=Math.max(...xs)+W+20, maxY=Math.max(...ys)+H+20;
  const mW=130, mH=85;
  const sx=mW/(maxX-minX), sy=mH/(maxY-minY), sc=Math.min(sx,sy);
  mm.innerHTML = '';
  NODES.forEach(n=>{
    const r = document.createElementNS(svgNS,'rect');
    r.setAttribute('x',(n.x-minX)*sc); r.setAttribute('y',(n.y-minY)*sc);
    r.setAttribute('width',W*sc); r.setAttribute('height',H*sc);
    r.setAttribute('rx',2); r.setAttribute('fill',n.color+'88');
    mm.appendChild(r);
  });
  const svgEl = document.getElementById('map');
  const vr = document.createElementNS(svgNS,'rect');
  const vpX = (-transform.x/transform.scale - minX)*sc;
  const vpY = (-transform.y/transform.scale - minY)*sc;
  const vpW = ((svgEl.clientWidth||800)/transform.scale)*sc;
  const vpH = ((svgEl.clientHeight||600)/transform.scale)*sc;
  vr.setAttribute('x',vpX); vr.setAttribute('y',vpY);
  vr.setAttribute('width',vpW); vr.setAttribute('height',vpH);
  vr.setAttribute('fill','none'); vr.setAttribute('stroke','#fff'); vr.setAttribute('stroke-width','1.5'); vr.setAttribute('opacity','0.6');
  mm.appendChild(vr);
}
updateMinimap();
